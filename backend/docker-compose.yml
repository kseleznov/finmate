version: '3.9'
services:
  postgres:
    image: postgres:15-alpine
    container_name: finmate-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: finmate
      POSTGRES_PASSWORD: finmate
      POSTGRES_DB: finmate
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
